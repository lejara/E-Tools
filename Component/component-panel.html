<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Component Command Center</title>
    <style>
      body {
        font:
          12px/1.4 system-ui,
          sans-serif;
        margin: 0;
        padding: 12px;
        background: #1e1e1e;
        color: #eee;
      }
      h1 {
        font-size: 11px;
        margin: 0 0 8px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #999;
      }
      .empty {
        color: #888;
        font-style: italic;
      }
      button.clear {
        background: #333;
        color: #eee;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 4px 10px;
        font: inherit;
        font-size: 11px;
        cursor: pointer;
        white-space: nowrap;
      }
      button.clear:hover:not(:disabled) {
        background: #3a3a3a;
      }
      button.clear:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button.primary {
        background: #3880ff;
        border-color: #3880ff;
        color: #fff;
      }
      button.primary:hover:not(:disabled) {
        background: #4a8dff;
      }

      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      .bar h1 {
        margin: 0;
        flex: 1 1 auto;
      }

      input[type="search"],
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        background: #262626;
        color: #eee;
        border: 1px solid #3a3a3a;
        border-radius: 4px;
        padding: 6px 8px;
        font: inherit;
      }
      input[type="search"]:focus,
      input[type="text"]:focus {
        outline: none;
        border-color: #3880ff;
      }

      .status {
        margin: 8px 0;
        font-size: 11px;
        color: #888;
        min-height: 15px;
      }
      .status.ok {
        color: #6ac47a;
      }
      .status.warn {
        color: #e0b060;
      }
      .status.error {
        color: #e07070;
      }

      .filters {
        display: flex;
        gap: 6px;
        margin: 8px 0;
        flex-wrap: wrap;
      }
      .filters button.on {
        background: #2f4a7a;
        border-color: #3880ff;
        color: #fff;
      }

      /* One row per component. The indent is the tree: a base sits at the left
         edge and every instance beneath it steps in, so depth is readable
         without drawing connectors that would fight the row buttons. */
      .row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 6px 8px;
        border-bottom: 1px solid #2c2c2c;
      }
      .row:hover {
        background: #242424;
      }
      .row .icon {
        flex: 0 0 auto;
        font-size: 13px;
        line-height: 1.5;
      }
      .row .body {
        flex: 1 1 auto;
        min-width: 0;
      }
      .row .name {
        font-size: 12px;
        color: #eee;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row .meta {
        margin-top: 2px;
        color: #808080;
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row .buttons {
        display: flex;
        gap: 4px;
        flex: 0 0 auto;
      }
      .row .buttons button {
        padding: 3px 8px;
      }

      .tone-ok {
        color: #6ac47a;
      }
      .tone-warn {
        color: #e0b060;
      }
      .tone-error {
        color: #e07070;
      }
      .tone-info {
        color: #7a9cff;
      }

      .badge {
        display: inline-block;
        border-radius: 3px;
        padding: 0 5px;
        margin-left: 6px;
        font-size: 10px;
        line-height: 15px;
        vertical-align: 1px;
        background: #333;
        color: #bbb;
      }
      .badge.base {
        background: #2f4a7a;
        color: #cfe0ff;
      }

      .twisty {
        flex: 0 0 auto;
        width: 14px;
        text-align: center;
        cursor: pointer;
        color: #888;
        user-select: none;
        line-height: 1.5;
      }
      .twisty.leaf {
        cursor: default;
        color: #444;
      }

      #tree {
        border-top: 1px solid #2c2c2c;
      }

      .foot {
        margin-top: 10px;
        font-size: 11px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <h1>Component Command Center</h1>
      <button id="refresh" class="clear primary" type="button">Refresh</button>
    </div>

    <!-- These act on whatever document an editor tab has open, not on the tree
         below. Kept visually separate for that reason: everything under the
         search box describes the whole site, everything here describes one
         document. -->
    <h1 style="margin-top: 4px">This document</h1>
    <div class="filters">
      <button id="a-overlay" class="clear" type="button">In-editor panel</button>
      <button id="a-sync" class="clear" type="button">Sync</button>
      <button id="a-new" class="clear" type="button">New Component</button>
      <button id="a-insert" class="clear" type="button">Insert…</button>
      <button
        id="a-link"
        class="clear"
        type="button"
        title="Select a container in the editor first, then link it to an existing component"
      >
        Link…
      </button>
      <button
        id="a-reset"
        class="clear"
        type="button"
        title="Discard an instance's overrides and added nodes so it matches its base again"
      >
        Reset to Base…
      </button>
      <button id="a-detach" class="clear" type="button">Detach…</button>
    </div>
    <div id="doc-status" class="status"></div>

    <h1 style="margin-top: 12px">Site</h1>
    <input
      id="search"
      type="search"
      placeholder="Search components, documents, types…"
      autocomplete="off"
    />

    <div class="filters">
      <button id="f-all" class="clear on" type="button">All</button>
      <button id="f-attention" class="clear" type="button">Needs attention</button>
      <button id="f-bases" class="clear" type="button">Bases only</button>
      <button id="expand" class="clear" type="button">Expand all</button>
      <button id="collapse" class="clear" type="button">Collapse all</button>
    </div>

    <div id="status" class="status"></div>
    <div id="tree"><div class="empty">Not scanned yet.</div></div>
    <div id="foot" class="foot"></div>

    <script src="../template-format.js"></script>
    <script src="component-format.js"></script>
    <script src="component-panel.js"></script>
  </body>
</html>
